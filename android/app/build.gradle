plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.boccaccio0.schedule'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.boccaccio0.schedule"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // 缺少正式密钥时让 release 构建失败，禁止回退到临时调试签名。
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: '../signing/release.p12')
            storeType 'PKCS12'
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'hhu-release'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
