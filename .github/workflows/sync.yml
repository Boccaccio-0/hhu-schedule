name: 同步课表数据

on:
  schedule:
    # 每天北京时间 06:30（GitHub Actions 的 cron 使用 UTC）
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 运行解析测试
        run: python tests/test_parse.py

      - name: 抓取并加密课表
        env:
          HHU_USERNAME: ${{ secrets.HHU_USERNAME }}
          HHU_PASSWORD: ${{ secrets.HHU_PASSWORD }}
          SCHEDULE_PASSPHRASE: ${{ secrets.SCHEDULE_PASSPHRASE }}
        run: python scripts/fetch_schedule.py --out web/data/schedule.enc.json

      - name: 提交数据变化
        run: |
          if [ -z "$(git status --porcelain web/data/schedule.enc.json)" ]; then
            echo "课表数据没有变化，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/schedule.enc.json
          git commit -m "chore: 更新课表数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
