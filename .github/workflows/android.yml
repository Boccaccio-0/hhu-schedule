name: 构建 Android APK

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 查看 Android SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: 把网页资源打进 App
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/
          echo "打包进去的文件："
          find android/app/src/main/assets/www -type f | sed 's|.*/assets/||' | sort

      - name: 准备固定签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?请配置固定的 Android 签名密钥}"
          : "${ANDROID_KEYSTORE_PASSWORD:?请配置签名密码}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hhu-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hhu-release.p12" >> "$GITHUB_ENV"

      - name: 测试并构建 APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hhu-schedule.apk
          jq '.elements[0] | {versionCode, versionName, apkUrl: "https://github.com/Boccaccio-0/hhu-schedule/releases/download/apk/hhu-schedule.apk"}' \
            android/app/build/outputs/apk/release/output-metadata.json > update.json
          jq -e '.versionCode > 0 and (.versionName | type == "string")' update.json
          ls -lh hhu-schedule.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version_name=$(jq -r '.versionName' update.json)
          cat > release-notes.txt <<'EOF'
          下载 hhu-schedule.apk，点开后按 Android 提示安装。

          1.3 新增：进入「时间安排」自动定位当前时段，并高亮显示；空档时定位下一段。
          设置页与解锁页提供「检查应用更新」，可直接在手机上检查、下载新版。
          从 1.2 起使用固定签名，后续覆盖安装会保留本机时间安排及口令。

          注意：1.0 / 1.1 使用临时签名，首次升级到 1.2 或以后版本时需先卸载旧版。
          卸载会清除本机数据，请先记录需要保留的自定义安排，重新安装后输入同步口令。
          课表内容仍可联网同步；时间安排的本地修改不会自动跨设备同步。
          EOF
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "课表 App" --notes-file release-notes.txt
          gh release upload apk hhu-schedule.apk --clobber
          # 安装包上传完成后再发布其版本信息，避免先提示升级却还没有新版安装包。
          gh release upload apk update.json --clobber
          gh release edit apk --title "课表 App $version_name（Android 安装包）" --notes-file release-notes.txt
          echo "下载地址：https://github.com/${{ github.repository }}/releases/download/apk/hhu-schedule.apk"

      - name: 清除运行器签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/hhu-release.p12"
